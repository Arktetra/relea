project: "VAE"
tags: "first-run"
seed: 41

models:
  name: "VAE"
  args:
    encoder:
      name: "VEncoder"
      args:
        in_channels: 3
        latent_dim: 64
        hidden_channels: [8, 16, 32, 64, 128]
    decoder:
      name: "VDecoder"
      args:
        out_channels: 3
        latent_dim: 64
        hidden_channels: [128, 64, 32, 16, 8]
    weight_recon: 1
    weight_reg: 1

data:
  name: "ImagenetteDataModule"
  args:
    root: "./"   # path to the root directory
    batch_size: 256
    shuffle: True
    num_workers: 0  # for mac
    on_gpu: False   # pin memory

trainer:
  name: "VAETrainer"
  args:
    max_epochs: 20
    optimizer:
      name: "AdamW"
      args:
        lr: 0.0001
        weight_decay: 0.0
    sample_epoch: 5  # saves a few samples at the end of each epoch
    device: "mps"
    checkpoint_dir: "./ckpts/"
    track: "loss"
    clip_grad: False
    